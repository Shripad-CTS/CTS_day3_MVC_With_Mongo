<div class="login-page" ng-controller="LoginController">
    <div class="login-container">
        <!-- Decorative Background Elements -->
        <div class="bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <!-- Header Section -->
            <div class="login-header">
                <div class="logo-circle">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to continue to Employee Management System</p>
            </div>

            <!-- Login Form -->
            <form class="login-form" ng-submit="login()">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>
                    <div class="input-wrapper">
                        <i class="input-icon fas fa-at"></i>
                        <input 
                            type="email" 
                            id="email"
                            ng-model="loginData.email"
                            required
                            placeholder="you@company.com"
                            class="form-input">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                    </div>
                    <div class="input-wrapper">
                        <i class="input-icon fas fa-key"></i>
                        <input 
                            type="password" 
                            id="password"
                            ng-model="loginData.password"
                            required
                            placeholder="Enter your password"
                            class="form-input">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

      <div class="login-footer">
                <div class="security-badge">
                    {{error}}
                </div>
            </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In to Dashboard
                </button>
            </form>

     
  

            <!-- Footer Links -->
            <div class="login-footer">
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i>
                    Protected by Spring Security
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.querySelector('.toggle-password i');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.classList.remove('fa-eye');
        toggleBtn.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        toggleBtn.classList.remove('fa-eye-slash');
        toggleBtn.classList.add('fa-eye');
    }
}
</script>
