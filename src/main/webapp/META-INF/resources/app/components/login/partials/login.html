

<div class="login-container" ng-controller="LoginController">

    <div class="login-title">Sign In</div>

    <form class="login-form" ng-submit="login()">

        <input type="email"
               class="login-input"
               ng-model="loginData.email"
               placeholder="Email"
               required>

        <input type="password"
               class="login-input"
               ng-model="loginData.password"
               placeholder="Password"
               required>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <div class="login-error" ng-if="error">
        {{ error }}
    </div>

</div>
